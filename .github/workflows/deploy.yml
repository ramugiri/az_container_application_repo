name: build-and-deploy

# Frontend (repo root). PRs: test only. Push to main: test, build, push, deploy to dev.
# Other environments: Actions -> build-and-deploy -> Run workflow -> pick env.

on:
  push:
    branches: [main]
    paths-ignore: ["service/**", ".github/workflows/deploy-service.yml", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["service/**", ".github/workflows/deploy-service.yml", "**.md"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, uat, prd]
        required: true

permissions:
  id-token: write # OIDC to Azure
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/_build-deploy.yml
    secrets: inherit
    with:
      app: frontend
      # Must match frontend_image (repo part) and the port in az-mcm-app-infra
      image_name: madg-construction-observations
      target_port: "8080"
      context: "."
      environment: ${{ github.event.inputs.environment || 'dev' }}
      deploy: ${{ github.event_name != 'pull_request' }}
